<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mockup – Popup (hero master + live meters)</title><style>
:root{
  --bg:#0b0e14; --card:#151a25; --card2:#1a2030; --line:#232a3b; --track:#262d3d;
  --text:#e9edf5; --dim:#8892a8; --accent:#4cc2ff; --bad:#ff5468; --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.35 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  display:grid;place-items:center;min-height:100vh;user-select:none;padding:24px}
.pop{width:340px;background:#141821;border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 16px 48px rgba(0,0,0,.5)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.hd b{font-weight:600;font-size:14px}
button{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--dim)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ib{width:30px;height:30px;border-radius:8px}
.ib:hover,.mu:hover{background:#1e2431;color:var(--text)}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hero{background:var(--card2);border-radius:var(--r);padding:14px;margin-bottom:10px;position:relative}
.hero-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dev{background:#232b3b;border-radius:8px;padding:6px 10px;gap:6px;font-size:12px;color:var(--text)}
.dev svg{width:15px;height:15px}.dev svg:first-child{color:var(--accent)}
.menu{position:absolute;top:50px;left:14px;background:#1e2535;border:1px solid var(--line);border-radius:10px;padding:4px;z-index:2;display:none;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.menu.open{display:block}
.menu button{display:flex;justify-content:flex-start;gap:8px;width:100%;padding:7px 10px;border-radius:7px;color:var(--text)}
.menu button:hover{background:#262f44}.menu button.sel{color:var(--accent)}
.big{display:flex;align-items:flex-end;gap:6px;margin-bottom:12px}
.big .n{font-size:44px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums}
.big .u{color:var(--dim);padding-bottom:5px}
.meter{flex:1;display:flex;gap:2px;align-items:flex-end;height:30px;justify-content:flex-end}
.meter i{width:3px;border-radius:1px;background:var(--track);transition:height .08s,background .08s}
.meter i.hot{background:var(--accent)}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;margin:0;width:100%;min-width:0;outline:none;
  background:linear-gradient(90deg,var(--accent) var(--v,50%),var(--track) var(--v,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:0}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:6px}
.mu{width:28px;height:28px;border-radius:8px;flex:none}
.muted input[type=range]{background:linear-gradient(90deg,#4a5266 var(--v,50%),var(--track) var(--v,50%))}
.muted .mu{color:var(--bad)}.muted .nm,.muted .meter{opacity:.45}
.list{display:flex;flex-direction:column;gap:6px;max-height:268px;overflow:auto;padding-right:2px}
.list::-webkit-scrollbar{width:6px}.list::-webkit-scrollbar-thumb{background:var(--track);border-radius:3px}
.app{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:#181d2a}
.app:hover{background:#1b2131}
.av{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:600;font-size:13px;color:#141821}
.mid{flex:1;min-width:0}
.line{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc{color:var(--dim);font-size:11px;font-variant-numeric:tabular-nums}
.app .meter{height:10px;flex:none;gap:2px}.app .meter i{width:3px}
.idle .meter{opacity:.35}
</style></head><body>
<div class="pop" id="pop">
  <div class="hd"><b>Volume mixer</b>
    <button class="ib" aria-label="Open full mixer"><svg viewBox="0 0 24 24"><path d="M12 6H7a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-5M11 13l9-9M15 4h5v5"/></svg></button></div>
  <div class="hero" id="hero">
    <div class="hero-top">
      <button class="dev" id="devBtn" aria-haspopup="listbox"><svg viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3M4 15h3v5H5a1 1 0 0 1-1-1zM20 15h-3v5h2a1 1 0 0 0 1-1z"/></svg><span id="devName">Headphones</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="mu" id="mMute" aria-label="Mute"></button>
    </div>
    <div class="menu" id="menu" role="listbox"></div>
    <div class="big"><span class="n" id="mN">22</span><span class="u">%</span><div class="meter" id="mMeter"></div></div>
    <input type="range" id="mR" min="0" max="100" value="22" aria-label="Master volume">
  </div>
  <div class="list" id="list"></div>
</div>
<script>
const ICON={on:'<svg viewBox="0 0 24 24"><path d="M6 9H3v6h3l5 4V5zM16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
 off:'<svg viewBox="0 0 24 24"><path d="M6 9H3v6h3l5 4V5zM16 9l5 6M21 9l-5 6"/></svg>'};
const devices=['Headphones','Speakers','Line'];
const apps=[['Winamp','W','#f58fb4'],['Mozilla Firefox','M','#9a8cff'],['System sounds','S','#ff9a73'],['msedgewebview2','M','#4ddb94'],['FSCapture','F','#f58fb4'],['Discord','D','#7aa7ff']];
const $=s=>document.querySelector(s);
const paint=r=>r.style.setProperty('--v',r.value+'%');
function mute(el,btn){const m=el.classList.toggle('muted');btn.innerHTML=m?ICON.off:ICON.on}
function bars(n,h){let s='';for(let i=0;i<n;i++)s+='<i style="height:'+h+'px"></i>';return s}
$('#mMute').innerHTML=ICON.on;$('#mMute').onclick=()=>mute($('#hero'),$('#mMute'));
$('#mMeter').innerHTML=bars(20,4);
const mR=$('#mR');mR.oninput=()=>{paint(mR);$('#mN').textContent=mR.value};paint(mR);
$('#menu').innerHTML=devices.map(d=>'<button role="option" class="'+(d==='Headphones'?'sel':'')+'">'+d+'</button>').join('');
$('#devBtn').onclick=e=>{e.stopPropagation();$('#menu').classList.toggle('open')};
$('#menu').onclick=e=>{const b=e.target.closest('button');if(!b)return;$('#devName').textContent=b.textContent;
  [...$('#menu').children].forEach(c=>c.classList.toggle('sel',c===b));$('#menu').classList.remove('open')};
document.onclick=()=>$('#menu').classList.remove('open');
const list=$('#list');
apps.forEach(([n,l,c])=>{
  const row=document.createElement('div');row.className='app';
  row.innerHTML='<span class="av" style="background:'+c+'">'+l+'</span><div class="mid"><div class="line"><span class="nm">'+n+'</span><span style="display:flex;gap:8px;align-items:center"><span class="meter">'+bars(10,3)+'</span><span class="pc">100</span></span></div><input type="range" value="100" aria-label="'+n+' volume"></div><button class="mu" aria-label="Mute '+n+'">'+ICON.on+'</button>';
  const r=row.querySelector('input'),pc=row.querySelector('.pc'),b=row.querySelector('.mu');
  r.oninput=()=>{paint(r);pc.textContent=r.value};paint(r);b.onclick=()=>mute(row,b);list.appendChild(row)});
function animate(meter,level,max,h){[...meter.children].forEach((b,i)=>{const on=i<level*max;b.classList.toggle('hot',on);b.style.height=on?(h*0.5+h*0.5*Math.abs(Math.sin(i*.9+Date.now()/300)))+'px':(h*0.25)+'px'})}
setInterval(()=>{
  const mm=$('#hero').classList.contains('muted');
  animate($('#mMeter'),mm?0:Math.random()*.5+.15,20,28);
  document.querySelectorAll('.app').forEach((a,i)=>{
    const live=!a.classList.contains('muted')&&i<4&&i!==2;a.classList.toggle('idle',!live);
    animate(a.querySelector('.meter'),live?Math.random()*.7+.1:0,10,10)})},110);
</script></body></html>
