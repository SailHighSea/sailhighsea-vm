<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mockup – App Icons</title>
<style>
:root{--bg:#0b0e14;--card:#151a25;--line:#232a3b;--text:#e9edf5;--dim:#8892a8;--accent:#4cc2ff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 70% -10%,#1d2a52 0%,transparent 60%),var(--bg);color:var(--text);
  font:14px/1.4 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;padding:28px}
h1{font-size:18px;margin:0 0 4px}.sub{color:var(--dim);font-size:13px;margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:.12s}
.card:hover{border-color:#2f3850}.card.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,194,255,.14)}
.big{display:flex;justify-content:center;padding:8px 0}
.big svg{width:150px;height:150px;filter:drop-shadow(0 10px 24px #0008)}
.sizes{display:flex;align-items:flex-end;justify-content:center;gap:14px}
.sizes svg{display:block}
.name{font-weight:600}.desc{color:var(--dim);font-size:12px;margin-top:-8px}
.ctx{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.ctx{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h3{margin:0 0 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.tray{display:flex;align-items:center;justify-content:flex-end;gap:14px;background:#0a0d14;border:1px solid var(--line);border-radius:10px;padding:10px 14px;color:var(--dim);font-size:12px}
.tray svg{width:18px;height:18px}
.task{display:flex;gap:10px;background:#0a0d14;border:1px solid var(--line);border-radius:10px;padding:8px 12px;align-items:center}
.task .ico{width:36px;height:36px;border-radius:8px;display:grid;place-items:center}
.task .ico.act{background:#1b2130;border-bottom:2px solid var(--accent)}
.task .ico svg{width:26px;height:26px}
.ph{width:36px;height:36px;border-radius:8px;background:#1b2130}
</style>
</head>
<body>
<h1>SailHighSea VM – app icon ideas</h1>
<div class="sub">Click one to preview it as a tray icon and a taskbar icon. Each is drawn as SVG, so it can be exported to .ico / .icns / .png for Tauri.</div>

<svg width="0" height="0" style="position:absolute">
<defs>
  <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4cc2ff"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
  <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c2a52"/><stop offset="1" stop-color="#0b1226"/></linearGradient>
  <linearGradient id="g3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#35d07f"/><stop offset=".6" stop-color="#4cc2ff"/><stop offset="1" stop-color="#7c6cff"/></linearGradient>
  <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8a5c"/><stop offset="1" stop-color="#ff4f81"/></linearGradient>

  <!-- 1. Equalizer bars -->
  <symbol id="i1" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="url(#g2)"/>
    <rect x="20" y="46" width="11" height="30" rx="5.5" fill="url(#g3)"/>
    <rect x="36" y="26" width="11" height="50" rx="5.5" fill="url(#g3)"/>
    <rect x="52" y="36" width="11" height="40" rx="5.5" fill="url(#g3)"/>
    <rect x="68" y="54" width="11" height="22" rx="5.5" fill="url(#g3)"/>
  </symbol>

  <!-- 2. Sail + waves -->
  <symbol id="i2" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="url(#g2)"/>
    <path d="M50 16 L50 62 L24 62 Z" fill="url(#g1)"/>
    <path d="M54 26 L54 62 L76 62 Z" fill="#e9edf5" opacity=".9"/>
    <path d="M14 72 q9 -8 18 0 t18 0 t18 0 t18 0" fill="none" stroke="#4cc2ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M14 84 q9 -8 18 0 t18 0 t18 0 t18 0" fill="none" stroke="#7c6cff" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  </symbol>

  <!-- 3. Fader knob -->
  <symbol id="i3" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="url(#g1)"/>
    <rect x="43" y="16" width="14" height="68" rx="7" fill="#0b1226" opacity=".35"/>
    <rect x="43" y="46" width="14" height="38" rx="7" fill="#fff" opacity=".9"/>
    <rect x="26" y="38" width="48" height="22" rx="8" fill="#fff"/>
    <rect x="34" y="47.5" width="32" height="3" rx="1.5" fill="#4a5bd8"/>
  </symbol>

  <!-- 4. Two speakers / mirror (multi-output) -->
  <symbol id="i4" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="url(#g2)"/>
    <circle cx="38" cy="50" r="22" fill="none" stroke="url(#g1)" stroke-width="7"/>
    <circle cx="62" cy="50" r="22" fill="none" stroke="#35d07f" stroke-width="7" opacity=".9"/>
    <circle cx="50" cy="50" r="6" fill="#e9edf5"/>
  </symbol>

  <!-- 5. Ship wheel as dial -->
  <symbol id="i5" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="url(#g2)"/>
    <g stroke="url(#g1)" stroke-width="6" stroke-linecap="round" fill="none">
      <circle cx="50" cy="50" r="22"/>
      <path d="M50 14v14M50 72v14M14 50h14M72 50h14M24.5 24.5l10 10M65.5 65.5l10 10M75.5 24.5l-10 10M34.5 65.5l-10 10"/>
    </g>
    <circle cx="50" cy="50" r="7" fill="#e9edf5"/>
  </symbol>

  <!-- 6. Waveform circle -->
  <symbol id="i6" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="48" fill="url(#g1)"/>
    <g fill="#fff">
      <rect x="21" y="43" width="7" height="14" rx="3.5"/><rect x="33" y="33" width="7" height="34" rx="3.5"/>
      <rect x="46.5" y="22" width="7" height="56" rx="3.5"/><rect x="60" y="33" width="7" height="34" rx="3.5"/>
      <rect x="72" y="43" width="7" height="14" rx="3.5"/>
    </g>
  </symbol>

  <!-- 7. Sunset sail (warm) -->
  <symbol id="i7" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="url(#g4)"/>
    <path d="M50 18 L50 64 L26 64 Z" fill="#fff"/>
    <path d="M55 30 L55 64 L74 64 Z" fill="#fff" opacity=".7"/>
    <path d="M16 74 q8.5 -8 17 0 t17 0 t17 0 t17 0" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
  </symbol>

  <!-- 8. Monogram S as sound wave -->
  <symbol id="i8" viewBox="0 0 100 100">
    <rect width="100" height="100" rx="22" fill="#0e1424"/>
    <path d="M70 30 C60 18 34 20 34 36 C34 52 66 46 66 64 C66 80 38 82 28 68" fill="none" stroke="url(#g1)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="74" cy="22" r="0"/>
  </symbol>
</defs>
</svg>

<div class="grid" id="grid"></div>

<div class="ctx">
  <div class="panel"><h3>System tray</h3><div class="tray" id="tray"><span>ENG</span><span id="trayico"></span><span>16:42</span></div></div>
  <div class="panel"><h3>Taskbar</h3><div class="task"><div class="ph"></div><div class="ph"></div><div class="ico act" id="taskico"></div><div class="ph"></div></div></div>
</div>

<script>
const ideas=[
 ['i1','Equalizer','Four gradient level bars. Reads as "audio" instantly and stays legible at 16 px.'],
 ['i2','Sail & waves','A nod to the SailHighSea name: two sails above stacked waves.'],
 ['i3','Fader','A single mixer fader. Simple, strong silhouette, very "volume mixer".'],
 ['i4','Two outputs','Two overlapping rings: multi-device output in one picture.'],
 ['i5','Ship wheel','A helm that doubles as a volume dial.'],
 ['i6','Waveform disc','Round badge with a symmetrical waveform. Friendly and bold.'],
 ['i7','Sunset sail','Warm alternative palette, stands out in a cool-toned tray.'],
 ['i8','Monogram','Letter S drawn as a flowing sound wave on a dark tile.'],
];
const use=id=>`<svg viewBox="0 0 100 100"><use href="#${id}"/></svg>`;
const grid=document.getElementById('grid');
ideas.forEach(([id,name,desc],i)=>{
  const c=document.createElement('div');c.className='card'+(i===0?' on':'');
  c.innerHTML=`<div class="big">${use(id)}</div>
   <div class="sizes">${[64,48,32,24,16].map(s=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100"><use href="#${id}"/></svg>`).join('')}</div>
   <div class="name">${i+1}. ${name}</div><div class="desc">${desc}</div>`;
  c.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('on'));c.classList.add('on');ctx(id)};
  grid.append(c);
});
function ctx(id){document.getElementById('trayico').innerHTML=use(id).replace('<svg','<svg style="width:18px;height:18px;display:block"');document.getElementById('taskico').innerHTML=use(id)}
ctx('i1');
</script>
</body>
</html>
