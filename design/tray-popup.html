<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mockup – Tray Popup</title><style>
:root{
  --bg:#0b0e14; --card:#151a25; --card2:#1a2030; --line:#232a3b;
  --text:#e9edf5; --dim:#8892a8; --accent:#4cc2ff; --accent2:#7c6cff;
  --ok:#35d07f; --warn:#f2c744; --bad:#ff5468; --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#1a2140 0%,transparent 60%),var(--bg);
  color:var(--text);font:14px/1.35 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;user-select:none}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(16,20,29,.7)}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:700;color:#07101c}
.top h1{font-size:15px;margin:0;font-weight:600}
.sp{flex:1}
.pill{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:12px;cursor:pointer}
.pill.on{color:var(--text);border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,194,255,.12)}
.nav{display:flex;gap:6px;padding:10px 22px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.nav a{color:var(--dim);text-decoration:none;padding:4px 10px;border-radius:8px}
.nav a:hover,.nav a.cur{color:var(--text);background:var(--card)}
h2{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r)}
.sl{position:relative;height:22px;display:flex;align-items:center;flex:1}
.sl input{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:none;margin:0;cursor:pointer;
  background:linear-gradient(90deg,var(--accent) var(--v,50%),#262e42 var(--v,50%))}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0008;border:3px solid var(--accent)}
.meter{height:5px;border-radius:5px;background:#0c0f16;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;width:0;border-radius:5px;background:linear-gradient(90deg,var(--ok) 0 62%,var(--warn) 80%,var(--bad))}
.mbtn{border:1px solid var(--line);background:#10141d;color:var(--dim);min-width:34px;height:30px;border-radius:9px;cursor:pointer;font-size:13px;padding:0 8px}
.mbtn:hover{color:var(--text)}
.mbtn.act{background:rgba(255,84,104,.15);color:var(--bad);border-color:rgba(255,84,104,.5)}
.logo2{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#07101c;flex:none}
.sub{font-size:11px;color:var(--dim)}
.nm{font-weight:600}
</style>
<style>
body{min-height:100vh;display:flex;flex-direction:column}
.desk{flex:1;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 20px 56px;background:linear-gradient(160deg,#162036,#0d1220 60%,#1b1636)}
.pop{width:360px;border-radius:18px;background:rgba(21,26,37,.92);border:1px solid #2a3248;box-shadow:0 20px 60px #000a;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.ph .nm{flex:1}
.outsel{margin:0 16px 10px;display:flex;gap:6px;background:#0e1219;padding:4px;border-radius:12px;border:1px solid var(--line)}
.outsel div{flex:1;text-align:center;padding:7px 0;border-radius:9px;color:var(--dim);cursor:pointer;font-size:12px}
.outsel div.on{background:var(--card2);color:var(--text);box-shadow:0 0 0 1px var(--accent) inset}
.master{padding:6px 16px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.master .big{font-size:26px;font-weight:600;width:64px;font-variant-numeric:tabular-nums}
.list{padding:8px 16px 6px;display:flex;flex-direction:column;gap:10px}
.r{display:flex;align-items:center;gap:10px}
.r .logo2{width:28px;height:28px;font-size:12px;border-radius:8px}
.r .sl{flex:1}.r .p{width:34px;text-align:right;font-size:12px;color:var(--dim)}
.foot{display:flex;padding:10px 16px 14px;gap:8px;border-top:1px solid var(--line);margin-top:8px;font-size:12px}
.foot span{color:var(--dim);cursor:pointer;padding:5px 9px;border-radius:8px}.foot span:hover{background:var(--card);color:var(--text)}
.taskbar{height:44px;background:#0a0d14ee;border-top:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;gap:14px;padding:0 18px;color:var(--dim);font-size:12px}
.taskbar b{color:var(--accent)}
</style></head><body>
<div class="nav"><a href="mockup.html">Cards</a><a href="classic-mixer.html">Classic mixer</a><a class="cur" href="tray-popup.html">Tray popup</a><a href="routing-matrix.html">Routing matrix</a></div>
<div class="desk"><div class="pop">
  <div class="ph"><div class="logo">S</div><div class="nm">Volume Mixer</div><div class="pill">Open full ↗</div></div>
  <div class="outsel" id="out"><div class="on">🔊 Speakers</div><div>🎧 Headphones</div><div>🖥 Monitor</div></div>
  <div class="master"><div class="big" id="mp">62</div><div class="sl"><input id="mi" type="range" value="62"></div><button class="mbtn" id="mm">🔇</button></div>
  <div class="list" id="list"></div>
  <div class="foot"><span>⇄ Multi-output</span><span>🎙 Mic</span><span>⚙ Settings</span></div>
</div></div>
<div class="taskbar"><span>ENG</span><b>🔊</b><span>16:42</span></div>
<script>
const apps=[['Spotify','#35d07f',70],['Discord','#7c6cff',85],['Chrome','#f2c744',55],['Game.exe','#ff7a59',40]];
const fill=i=>i.style.setProperty('--v',i.value+'%');
const mi=document.getElementById('mi');fill(mi);mi.oninput=()=>{fill(mi);mp.textContent=mi.value};
mm.onclick=()=>mm.classList.toggle('act');
document.querySelectorAll('#out div').forEach(d=>d.onclick=()=>{document.querySelectorAll('#out div').forEach(x=>x.classList.remove('on'));d.classList.add('on')});
apps.forEach(a=>{const r=document.createElement('div');r.className='r';
 r.innerHTML=`<div class="logo2" style="background:${a[1]}">${a[0][0]}</div><div class="sl"><input type="range" value="${a[2]}"></div><div class="p">${a[2]}%</div>`;
 const i=r.querySelector('input'),p=r.querySelector('.p');fill(i);i.oninput=()=>{fill(i);p.textContent=i.value+'%'};list.append(r)});
</script></body></html>
