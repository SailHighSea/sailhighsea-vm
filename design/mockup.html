<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SailHighSea VM – Mockup</title>
<style>
:root{
  --bg:#0b0e14; --bg2:#10141d; --card:#151a25; --card2:#1a2030; --line:#232a3b;
  --text:#e9edf5; --dim:#8892a8; --accent:#4cc2ff; --accent2:#7c6cff;
  --ok:#35d07f; --warn:#f2c744; --bad:#ff5468; --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 600px at 80% -10%,#1a2140 0%,transparent 60%),var(--bg);
  color:var(--text);font:14px/1.35 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;user-select:none;
}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);
  background:rgba(16,20,29,.7);backdrop-filter:blur(10px)}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-weight:700;color:#07101c}
.top h1{font-size:15px;margin:0;font-weight:600}
.top h1 span{color:var(--dim);font-weight:400;margin-left:8px;font-size:12px}
.sp{flex:1}
.pill{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:12px;cursor:pointer}
.pill.on{color:var(--text);border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,194,255,.12)}
.wrap{flex:1;overflow:auto;padding:20px 22px 28px;display:flex;flex-direction:column;gap:22px;min-height:0}
h2{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600;display:flex;gap:8px;align-items:center}
h2 em{font-style:normal;color:var(--accent);letter-spacing:0;text-transform:none;font-weight:500}

/* devices */
.devices{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.dev{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;position:relative;transition:.15s}
.dev.default{border-color:rgba(76,194,255,.55)}
.dev.off{opacity:.45}
.dev .row{display:flex;align-items:center;gap:10px}
.ico{width:34px;height:34px;border-radius:10px;background:#0e1219;border:1px solid var(--line);display:grid;place-items:center;font-size:17px}
.dev .nm{font-weight:600;line-height:1.1}
.dev .sub{font-size:11px;color:var(--dim)}
.badge{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:999px;background:rgba(76,194,255,.14);color:var(--accent);font-weight:600}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;min-width:56px}
.big small{font-size:12px;color:var(--dim);font-weight:400}

/* slider */
.sl{position:relative;height:22px;display:flex;align-items:center;flex:1}
.sl input{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:none;margin:0;cursor:pointer;
  background:linear-gradient(90deg,var(--accent) var(--v,50%),#262e42 var(--v,50%))}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0008;border:3px solid var(--accent)}
.muted .sl input{background:linear-gradient(90deg,#4a5166 var(--v),#262e42 var(--v))}
.muted .sl input::-webkit-slider-thumb{border-color:#4a5166}

/* meter */
.meter{height:5px;border-radius:5px;background:#0c0f16;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;width:0;border-radius:5px;
  background:linear-gradient(90deg,var(--ok) 0 62%,var(--warn) 80%,var(--bad));background-size:var(--full,300px) 100%;transition:width .08s linear}
.mini{display:flex;gap:2px;align-items:flex-end;height:18px}
.mini b{flex:1;background:#262e42;border-radius:2px;height:20%;transition:height .08s}

.mbtn{border:1px solid var(--line);background:#10141d;color:var(--dim);width:34px;height:30px;border-radius:9px;cursor:pointer;font-size:14px}
.mbtn:hover{color:var(--text);border-color:#2f3850}
.muted .mbtn.mute,.mbtn.mute.act{background:rgba(255,84,104,.15);color:var(--bad);border-color:rgba(255,84,104,.5)}

/* apps */
.apps{display:flex;flex-direction:column;gap:10px}
.app{display:grid;grid-template-columns:230px 1fr auto;gap:18px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.app .id{display:flex;align-items:center;gap:12px;min-width:0}
.logo2{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;color:#07101c;flex:none}
.app .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app .sub{font-size:11px;color:var(--dim)}
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl .l1{display:flex;align-items:center;gap:12px}
.pct{width:42px;text-align:right;font-variant-numeric:tabular-nums;color:var(--text);font-weight:600}
.routes{display:flex;gap:6px;align-items:center}
.routes .lbl{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin-right:4px}
.chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:9px;border:1px solid var(--line);background:#10141d;color:var(--dim);cursor:pointer;font-size:12px;transition:.12s}
.chip:hover{border-color:#2f3850}
.chip.on{color:var(--text);border-color:var(--accent);background:rgba(76,194,255,.1)}
.chip.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.app.muted{opacity:.6}

@media (max-width:860px){.app{grid-template-columns:1fr}.routes{flex-wrap:wrap}}
.nav{display:flex;gap:6px;padding:10px 22px;border-bottom:1px solid var(--line);font-size:12px}.nav a{color:var(--dim);text-decoration:none;padding:4px 10px;border-radius:8px}.nav a:hover,.nav a.cur{color:var(--text);background:var(--card)}
</style>
</head>
<body>
<div class="top">
  <div class="logo">S</div>
  <h1>SailHighSea VM <span>v0.0.1-dev1 · mockup</span></h1>
  <div class="sp"></div>
  <div class="pill on" id="mirror">⇄ Multi-output</div>
  <div class="pill">⚙ Settings</div>
</div>

<div class="nav"><a class="cur" href="mockup.html">Cards</a><a href="classic-mixer.html">Classic mixer</a><a href="tray-popup.html">Tray popup</a><a href="routing-matrix.html">Routing matrix</a></div>
<div class="wrap">
  <section>
    <h2>Output devices <em id="devcount"></em></h2>
    <div class="devices" id="devices"></div>
  </section>
  <section>
    <h2>Applications <em>route each app to one or more outputs</em></h2>
    <div class="apps" id="apps"></div>
  </section>
</div>

<script>
const devices=[
  {id:'spk',  name:'Speakers',        sub:'Realtek Audio',        ico:'🔊',vol:62,on:true,def:true},
  {id:'hp',   name:'Headphones',      sub:'USB DAC · Focusrite',   ico:'🎧',vol:48,on:true},
  {id:'hdmi', name:'Monitor',         sub:'NVIDIA HDMI',           ico:'🖥',vol:80,on:true},
  {id:'cable',name:'Virtual Cable',   sub:'Stream / OBS capture',  ico:'🎙',vol:100,on:true},
];
const apps=[
  {name:'Spotify',  sub:'Music',          c:'#35d07f',vol:70,routes:['spk','hp']},
  {name:'Discord',  sub:'Voice chat',     c:'#7c6cff',vol:85,routes:['hp','cable']},
  {name:'Chrome',   sub:'YouTube',        c:'#f2c744',vol:55,routes:['spk']},
  {name:'Game.exe', sub:'Cyberpunk 2077', c:'#ff7a59',vol:40,routes:['hp','cable']},
  {name:'System sounds',sub:'Windows',    c:'#4cc2ff',vol:30,routes:['spk']},
];
const $=s=>document.querySelector(s);
const meters=[];

function slider(val,cb){
  const w=document.createElement('div');w.className='sl';
  const i=document.createElement('input');i.type='range';i.min=0;i.max=100;i.value=val;
  const set=()=>i.style.setProperty('--v',i.value+'%');set();
  i.oninput=()=>{set();cb(+i.value)};w.append(i);return w;
}
function meter(){const m=document.createElement('div');m.className='meter';const b=document.createElement('i');m.append(b);meters.push({b,m,lvl:0,t:Math.random()*6});return m}

function renderDevices(){
  const el=$('#devices');el.innerHTML='';
  $('#devcount').textContent=devices.filter(d=>d.on).length+' active';
  devices.forEach(d=>{
    const c=document.createElement('div');c.className='dev'+(d.def?' default':'')+(d.on?'':' off');
    c.innerHTML=`<div class="row"><div class="ico">${d.ico}</div><div><div class="nm">${d.name}</div><div class="sub">${d.sub}</div></div>${d.def?'<span class="badge">DEFAULT</span>':''}</div>`;
    const r=document.createElement('div');r.className='row';
    const big=document.createElement('div');big.className='big';big.innerHTML=`${d.vol}<small>%</small>`;
    r.append(big,slider(d.vol,v=>{d.vol=v;big.innerHTML=`${v}<small>%</small>`}));
    const mb=document.createElement('button');mb.className='mbtn mute'+(d.muted?' act':'');mb.textContent='🔇';
    mb.onclick=()=>{d.muted=!d.muted;mb.classList.toggle('act',d.muted)};r.append(mb);
    c.append(r,meter());
    c.querySelector('.ico').onclick=()=>{d.on=!d.on;renderDevices();renderApps()};
    c.querySelector('.ico').style.cursor='pointer';c.querySelector('.ico').title='Enable / disable device';
    el.append(c);
  });
}

function renderApps(){
  const el=$('#apps');el.innerHTML='';
  apps.forEach(a=>{
    const row=document.createElement('div');row.className='app'+(a.muted?' muted':'');
    row.innerHTML=`<div class="id"><div class="logo2" style="background:${a.c}">${a.name[0]}</div><div style="min-width:0"><div class="nm">${a.name}</div><div class="sub">${a.sub}</div></div></div>`;
    const ctl=document.createElement('div');ctl.className='ctl';
    const l1=document.createElement('div');l1.className='l1';
    const pct=document.createElement('div');pct.className='pct';pct.textContent=a.vol+'%';
    const mb=document.createElement('button');mb.className='mbtn mute'+(a.muted?' act':'');mb.textContent='🔇';
    mb.onclick=()=>{a.muted=!a.muted;row.classList.toggle('muted',a.muted);mb.classList.toggle('act',a.muted)};
    l1.append(slider(a.vol,v=>{a.vol=v;pct.textContent=v+'%'}),pct,mb);
    ctl.append(l1,meter());
    const rt=document.createElement('div');rt.className='routes';rt.innerHTML='<span class="lbl">Output</span>';
    devices.filter(d=>d.on).forEach(d=>{
      const ch=document.createElement('div');ch.className='chip'+(a.routes.includes(d.id)?' on':'');ch.textContent=d.ico+' '+d.name;
      ch.onclick=()=>{
        const multi=$('#mirror').classList.contains('on');
        if(a.routes.includes(d.id)){ if(a.routes.length>1)a.routes=a.routes.filter(x=>x!==d.id); }
        else a.routes=multi?[...a.routes,d.id]:[d.id];
        renderApps();
      };
      rt.append(ch);
    });
    row.append(ctl,rt);el.append(row);
  });
}
$('#mirror').onclick=e=>e.currentTarget.classList.toggle('on');

renderDevices();renderApps();
setInterval(()=>{
  meters.forEach(o=>{
    if(!o.m.isConnected)return;
    o.t+=.25;
    const target=Math.max(0,(Math.sin(o.t)*.5+.5)*(.45+Math.random()*.55));
    o.lvl=Math.max(target,o.lvl-.06);
    o.b.style.setProperty('--full',o.m.clientWidth+'px');
    o.b.style.width=(o.lvl*100)+'%';
  });
},80);
</script>
</body>
</html>
