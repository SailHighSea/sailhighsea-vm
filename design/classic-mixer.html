<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mockup – Classic Mixer</title><style>
:root{
  --bg:#0b0e14; --card:#151a25; --card2:#1a2030; --line:#232a3b;
  --text:#e9edf5; --dim:#8892a8; --accent:#4cc2ff; --accent2:#7c6cff;
  --ok:#35d07f; --warn:#f2c744; --bad:#ff5468; --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(1200px 600px at 80% -10%,#1a2140 0%,transparent 60%),var(--bg);
  color:var(--text);font:14px/1.35 "Segoe UI Variable","Segoe UI",system-ui,sans-serif;user-select:none}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:rgba(16,20,29,.7)}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-weight:700;color:#07101c}
.top h1{font-size:15px;margin:0;font-weight:600}
.sp{flex:1}
.pill{padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--dim);font-size:12px;cursor:pointer}
.pill.on{color:var(--text);border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,194,255,.12)}
.nav{display:flex;gap:6px;padding:10px 22px;border-bottom:1px solid var(--line);font-size:12px;color:var(--dim)}
.nav a{color:var(--dim);text-decoration:none;padding:4px 10px;border-radius:8px}
.nav a:hover,.nav a.cur{color:var(--text);background:var(--card)}
h2{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r)}
.sl{position:relative;height:22px;display:flex;align-items:center;flex:1}
.sl input{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:6px;outline:none;margin:0;cursor:pointer;
  background:linear-gradient(90deg,var(--accent) var(--v,50%),#262e42 var(--v,50%))}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #0008;border:3px solid var(--accent)}
.meter{height:5px;border-radius:5px;background:#0c0f16;overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;width:0;border-radius:5px;background:linear-gradient(90deg,var(--ok) 0 62%,var(--warn) 80%,var(--bad))}
.mbtn{border:1px solid var(--line);background:#10141d;color:var(--dim);min-width:34px;height:30px;border-radius:9px;cursor:pointer;font-size:13px;padding:0 8px}
.mbtn:hover{color:var(--text)}
.mbtn.act{background:rgba(255,84,104,.15);color:var(--bad);border-color:rgba(255,84,104,.5)}
.logo2{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#07101c;flex:none}
.sub{font-size:11px;color:var(--dim)}
.nm{font-weight:600}
</style>
<style>
body{display:flex;flex-direction:column;height:100vh}
.tabs{display:flex;gap:8px;padding:14px 22px 0}
.tab{padding:8px 14px;border-radius:10px 10px 0 0;color:var(--dim);cursor:pointer;border:1px solid transparent;border-bottom:0}
.tab.on{background:var(--card);color:var(--text);border-color:var(--line)}
.board{flex:1;min-height:0;margin:0 22px 22px;background:var(--card);border:1px solid var(--line);border-radius:0 var(--r) var(--r) var(--r);display:flex;gap:10px;padding:16px;overflow-x:auto}
.strip{flex:0 0 104px;background:#10141d;border:1px solid var(--line);border-radius:12px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:8px}
.strip.master{flex-basis:128px;border-color:rgba(76,194,255,.5);margin-left:auto}
.strip .logo2{width:30px;height:30px;font-size:13px}
.nm2{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.db{font-variant-numeric:tabular-nums;font-size:12px;color:var(--text);background:#0b0e14;border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.fader{flex:1;min-height:180px;display:flex;gap:6px;align-items:stretch}
.scale{display:flex;flex-direction:column;justify-content:space-between;font-size:9px;color:var(--dim);text-align:right;padding:6px 0}
.rail{width:26px;position:relative}
.rail::before{content:"";position:absolute;left:50%;top:4px;bottom:4px;width:6px;margin-left:-3px;border-radius:3px;background:#262e42}
.fill{position:absolute;left:50%;bottom:4px;width:6px;margin-left:-3px;border-radius:3px;background:var(--accent)}
.knob{position:absolute;left:0;right:0;height:22px;margin-bottom:-11px;border-radius:6px;background:linear-gradient(#f4f6fb,#c9cfde);box-shadow:0 3px 8px #0009;cursor:ns-resize}
.knob::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:2px;background:var(--accent);margin-top:-1px}
.vm{width:10px;background:#0c0f16;border-radius:5px;position:relative;overflow:hidden;border:1px solid var(--line)}
.vm i{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,var(--ok) 0 62%,var(--warn) 80%,var(--bad));transition:height .08s}
.btns{display:flex;gap:6px;width:100%}.btns .mbtn{flex:1;padding:0;font-size:11px;font-weight:600}
.btns .mbtn.solo.act{background:rgba(242,199,68,.15);color:var(--warn);border-color:rgba(242,199,68,.5)}
select{width:100%;background:#0b0e14;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:11px}
</style></head><body>
<div class="top"><div class="logo">S</div><h1>SailHighSea VM</h1><div class="sp"></div><div class="pill">⚙ Settings</div></div>
<div class="nav"><a href="mockup.html">Cards</a><a class="cur" href="classic-mixer.html">Classic mixer</a><a href="tray-popup.html">Tray popup</a><a href="routing-matrix.html">Routing matrix</a></div>
<div class="tabs" id="tabs"></div>
<div class="board" id="board"></div>
<script>
const devs=[['spk','🔊 Speakers'],['hp','🎧 Headphones'],['hdmi','🖥 Monitor']];
const apps=[['Spotify','#35d07f',70],['Discord','#7c6cff',85],['Chrome','#f2c744',55],['Game.exe','#ff7a59',40],['System','#4cc2ff',30]];
let cur='spk';const meters=[];
const tabs=document.getElementById('tabs'),board=document.getElementById('board');
function db(p){return p==0?'-∞':(20*Math.log10(p/100)).toFixed(1)+' dB'}
function strip(name,color,vol,master){
  const s=document.createElement('div');s.className='strip'+(master?' master':'');
  s.innerHTML=`${master?'<div class="logo2" style="background:linear-gradient(135deg,#4cc2ff,#7c6cff)">M</div>':`<div class="logo2" style="background:${color}">${name[0]}</div>`}
  <div class="nm2">${name}</div><div class="db"></div>
  <div class="fader"><div class="scale"><span>0</span><span>-6</span><span>-12</span><span>-24</span><span>-∞</span></div>
  <div class="rail"><div class="fill"></div><div class="knob"></div></div>
  <div class="vm"><i></i></div><div class="vm"><i></i></div></div>
  ${master?'':`<select><option>Default device</option>${devs.map(d=>`<option ${d[0]==cur?'selected':''}>${d[1]}</option>`).join('')}</select>`}
  <div class="btns"><button class="mbtn mute">M</button><button class="mbtn solo">S</button></div>`;
  const rail=s.querySelector('.rail'),fill=s.querySelector('.fill'),knob=s.querySelector('.knob'),d=s.querySelector('.db');
  const set=v=>{v=Math.max(0,Math.min(100,v));fill.style.height=`calc(${v}% - 0px)`;knob.style.bottom=`calc(${v}% * .9 + 4px)`;d.textContent=db(v)};set(vol);
  const move=e=>{const r=rail.getBoundingClientRect();set(100-((e.clientY-r.top)/r.height*100))};
  knob.onpointerdown=e=>{knob.setPointerCapture(e.pointerId);knob.onpointermove=move;knob.onpointerup=()=>knob.onpointermove=null};
  rail.onclick=move;
  s.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>b.classList.toggle('act'));
  s.querySelectorAll('.vm i').forEach(i=>meters.push({i,t:Math.random()*6,l:0}));
  return s;
}
function render(){
  tabs.innerHTML=devs.map(d=>`<div class="tab ${d[0]==cur?'on':''}" data-id="${d[0]}">${d[1]}</div>`).join('');
  tabs.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{cur=t.dataset.id;render()});
  board.innerHTML='';meters.length=0;
  apps.forEach(a=>board.append(strip(a[0],a[1],a[2])));
  board.append(strip('Master',null,62,true));
}
render();
setInterval(()=>meters.forEach(o=>{o.t+=.3;const tg=(Math.sin(o.t)*.5+.5)*(.4+Math.random()*.6);o.l=Math.max(tg,o.l-.07);o.i.style.height=o.l*100+'%'}),80);
</script></body></html>
